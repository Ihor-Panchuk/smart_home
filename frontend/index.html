<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Smart Home</h1>
    <h2>Мои устройства</h2>

    <div id="add-device">
        <h2>Добавить устройство</h2>

        <input id="device-name" type="text" placeholder="Название">

        <select id="device-type">
            <option value="light">Освещение</option>
            <option value="thermostat">Термостат</option>
            <option value="door_lock">Замок</option>
        </select>

        <button id="add-device-button">Добавить</button>
    </div>

    <div id="categories">

        <div class="category">
            <button class="category-button">💡 Освещение <span>▼</span></button>
            <div id="lights"></div>
        </div>

        <div class="category">
            <button class="category-button">🌡️ Климат <span>▼</span></button>
            <div id="thermostats"></div>
        </div>

        <div class="category">
            <button class="category-button">🔒 Безопасность <span>▼</span></button>
            <div id="locks"></div>
        </div>

    </div>
    <div id="devices"></div>

    <script src="script.js?v=3"></script>

</body>


</html>
