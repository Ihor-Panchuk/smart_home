<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home</title>
    <link rel="stylesheet" href="style.css?v=9">
</head>

<body>
    <h1 class="app-title">Smart Home</h1>
    <p class="app-subtitle">Управление умным домом</p>
    <div id="authForms">
        <section id="register">
            <h2>Регистрация</h2>

            <input type="text" id="username" placeholder="Имя пользователя">

            <input type="password" id="password" placeholder="Пароль">

            <button id="registerBtn">Зарегистрироваться</button>
            <p id="registerMessage"></p>
        </section>

        <section id="login">
            <h2>Вход</h2>
            <input type="text" id="loginUsername" placeholder="Имя пользователя" autocomplete="off">
            <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="off">
            <button id="loginBtn">Войти</button>
            <p id="loginMessage"></p>
        </section>
    </div>
    <div id="authPanel">
        <p id="authStatus"></p>

        <div class="user-panel">
            <p id="usernameStatus">👤</p>
            <button id="logoutBtn">Выйти</button>
        </div>

        <div class="user-panel-line"></div>
    </div>

    <div class="devices-header">
        <h2>Мои устройства</h2>
        <p>Управление устройствами вашего дома</p>
    </div>

    <div id="add-device">
        <h2>Добавить устройство</h2>

        <input id="device-name" type="text" placeholder="Название">

        <select id="device-type">
            <option value="light">Освещение</option>
            <option value="thermostat">Термостат</option>
            <option value="door_lock">Замок</option>
        </select>

        <div id="brightness-field">
            <label for="device-brightness">Яркость: </label>
            <input id="device-brightness" type="number" min="0" max="100">
        </div>

        <div id="temperature-field">
            <label for="device-temperature">Температура:</label>
            <input id="device-temperature" type="number" min="10" max="30">
        </div>

        <button id="add-device-button">Добавить</button>
    </div>

    <div id="categories">

        <div class="category">
            <button class="category-button">💡 Освещение <span>▼</span></button>
            <div id="lights"></div>
        </div>

        <div class="category">
            <button class="category-button">🌡️ Климат <span>▼</span></button>
            <div id="thermostats"></div>
        </div>

        <div class="category">
            <button class="category-button">🔒 Безопасность <span>▼</span></button>
            <div id="locks"></div>
        </div>

    </div>

    <script src="script.js?v=13"></script>

</body>


</html>
